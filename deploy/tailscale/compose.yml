# satbook on a tailnet. The app shares the network namespace of its own
# Tailscale container, so nothing is published on the host: the only way in is
# https://satbook.<your-tailnet>.ts.net, from devices your tailnet policy lets
# through. Setup, first boot and the policy it needs: docs/self-hosting.md.
#
# Copy this folder out of the checkout before you fill in .env — your
# instance's config should not live in the repo — and point `build:` at the
# checkout. Then:
#   docker compose up -d --build    # deploy or update
#   docker compose logs -f app      # logs
name: satbook

# Every container: a read-only root, no Linux capabilities, no way to gain
# privileges, capped processes, and logs that don't grow forever.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  tmpfs: [/tmp]
  pids_limit: 256
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  # Hands the Tailscale state to TS_UID on every start, then exits, so the
  # sidecar itself never runs as root.
  owners:
    <<: *hardened
    image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    user: '0:0'
    # CHOWN to change owners; DAC_READ_SEARCH to walk directories TS_UID owns.
    cap_add: [CHOWN, DAC_READ_SEARCH]
    network_mode: none
    restart: 'no'
    entrypoint: [sh, -c, 'chown -R "$$TS_UID:$$TS_UID" /ts-state']
    environment:
      TS_UID: ${TS_UID:-10000}
    volumes:
      - ts-state:/ts-state
    cpus: 0.25
    mem_limit: 64m

  ts:
    <<: *hardened
    # Pinned by digest: bump it on purpose, after reading Tailscale's changelog.
    image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    # Pick a uid that no account on your host uses (set TS_UID in a .env next
    # to this file to change it).
    user: '${TS_UID:-10000}:${TS_UID:-10000}'
    hostname: satbook
    # containerboot links its socket into /var/run/tailscale for the CLI. Set the
    # mode: on a restart Docker remakes this tmpfs as root's 755, which a
    # non-root sidecar could no longer write.
    tmpfs: [/tmp, '/var/run/tailscale:mode=1777']
    environment:
      TS_HOSTNAME: satbook # the device name, and so the first label of the URL
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Log in only when there is no saved state, so a one-off auth key that has
      # already been used never blocks a restart.
      TS_AUTH_ONCE: 'true'
    env_file:
      # TS_AUTHKEY for the first login. Optional: without it, log in by hand
      # (see docs/self-hosting.md). Kept apart from .env so the app never sees it.
      - path: ts.env
        required: false
    volumes:
      - ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    depends_on:
      owners:
        condition: service_completed_successfully
    cpus: 0.5
    mem_limit: 256m

  app:
    <<: *hardened
    build: ../.. # your satbook checkout
    image: satbook-app
    network_mode: service:ts
    env_file: .env
    environment:
      DATABASE_PATH: /data/btc.db
      # Listen on loopback only. serve and Tailscale's userspace forwarding both
      # reach the app through 127.0.0.1; without this, other users on the host
      # could open it through the container's Docker bridge address.
      HOST: 127.0.0.1
    volumes:
      - btcdata:/data
    depends_on: [ts]
    cpus: 1.0
    mem_limit: 512m

volumes:
  ts-state:
  btcdata:
