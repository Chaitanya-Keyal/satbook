# satbook on a tailnet. The app shares the network namespace of its own
# Tailscale container, so nothing is published on the host: the only way in is
# https://satbook.<your-tailnet>.ts.net, from devices your tailnet policy lets
# through. Setup, first boot and the policy it needs: docs/self-hosting.md.
#
# Copy this folder out of the checkout before you fill in .env — your
# instance's config should not live in the repo — and point `build:` at the
# checkout. Then:
#   docker compose up -d --build    # deploy or update
#   docker compose logs -f app      # logs
name: satbook
services:
  ts:
    image: tailscale/tailscale:stable
    hostname: satbook
    environment:
      TS_HOSTNAME: satbook # the device name, and so the first label of the URL
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Log in only when there is no saved state, so a one-off auth key that has
      # already been used never blocks a restart.
      TS_AUTH_ONCE: 'true'
    env_file:
      # TS_AUTHKEY for the first login. Optional: without it, log in by hand
      # (see docs/self-hosting.md). Kept apart from .env so the app never sees it.
      - path: ts.env
        required: false
    volumes:
      - ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped
  app:
    build: ../.. # your satbook checkout
    image: satbook-app
    restart: unless-stopped
    network_mode: service:ts
    env_file: .env
    environment:
      DATABASE_PATH: /data/btc.db
      # Listen on loopback only. serve and Tailscale's userspace forwarding both
      # reach the app through 127.0.0.1; without this, other users on the host
      # could open it through the container's Docker bridge address.
      HOST: 127.0.0.1
    volumes:
      - btcdata:/data
    depends_on: [ts]
volumes:
  ts-state:
  btcdata:
