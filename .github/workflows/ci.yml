# The checks a PR has to pass before merging: types, tests, formatting and a
# production build. The same commands run locally:
#   bun run check && bun run test && bun run lint && bun run build
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commits; the comment says which release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # keep in step with the Docker image's Bun
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run lint
      - run: bun run build
